[metadata]
name = lxd-container-backup
version = 1.1.0
description = Copy an LXD container directory with rsync
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    lxd-container-backup = lxd_container_backup.cli:main
